<!DOCTYPE html>
<html>
  <head>
    <title>TripWeather! v2</title>
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <link type="text/css" rel="stylesheet" href="css/style.css">
    <!-- Updated to use script_v2.js -->
    <script src="js/script_v2.js"></script>
    <!-- Google Maps API with Geometry library for distance calculations -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDJfosGhkACjtAFQH2Gx5f-vU1SZdm_90E&callback=initMap&libraries=geometry" async></script>
  </head>
  <body>
    <div id="banner">
        <!-- Fixed case sensitivity: TWLogo.png -->
        <img id="logo" src="img/TWLogo.png" alt="TripWeather Logo">
        <span><a href="#">Trip Weather!</a></span>
        <span id="intro">Enter your starting and ending locations, and TripWeather will let you know what kind of weather you'll have along your drive.</span>
    </div>
    <div id="form">
        <form id="locationForm" name="locationForm" onsubmit="createInitialMarkers(); return false;">
            <fieldset id="locationFields" name="locationFields">
                <legend>From / To:</legend>
                <label for="from">From:</label>
                <input type="text" id="from" name="from" placeholder="CITY, ST or ZIP" autofocus required>
                <label for="to">To:</label>
                <input type="text" id="to" name="to" placeholder="CITY, ST or ZIP" required>
                <input type="button" id="submit" name="submit" value="Go!" onclick="createInitialMarkers();">
                <!-- Hidden submit button to submit form on 'Enter' keypress -->
                <input type="submit" name="update" value="Apply" style="position: absolute; height: 0px; width: 0px; border: none; padding: 0px;" hidefocus="true" tabindex="-1" />
            </fieldset>
        </form>
    </div>
    <div id="information"></div>
    <div class="clearfix"></div>
    <div id="map"></div>
    <div id="credit">
        <span>Icons provided by:</span>
        <a target="_blank" href="https://mapicons.mapsmarker.com">
            <img id="creditImage" src="img/miclogo.gif" alt="Map Icons Designer">
        </a>
    </div>
    <div id="copyright"><span>Copyright &copy; 2016-2026 TripWeather.</span></div>
  </body>
</html>
